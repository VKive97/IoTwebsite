  <script>
    (function ($) {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug');

      function notFound() {
        $('#post-article').hide();
        $('#post-not-found').show();
      }

      if (!slug) { notFound(); }
      else {
        AnstelBlog.getPost(slug).then(function (post) {
          if (!post || post.status !== 'published') { notFound(); return; }

          document.getElementById('doc-title').textContent = post.title + ' — Autonautics by Anstel';
          $('#post-title').text(post.title);
          if (post.category) $('#post-category').text(post.category).show();
          if (post.coverImage) $('#post-cover').attr('src', post.coverImage).attr('alt', post.title).show();
          $('#post-body').html(AnstelBlog.renderPostBody(post));
          $('#post-skeleton').hide();
          $('#post-real').show();

          if (post.categoryId) renderSuggested(post);
        }).catch(notFound);
      }

      function renderSuggested(currentPost) {
        AnstelBlog.getPostsByCategory(currentPost.categoryId).then(function (all) {
          var suggested = all.filter(function (p) {
            return p.status === 'published' && p.slug !== currentPost.slug;
          }).sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 3);

          if (!suggested.length) return;

          $('#suggested-category-label').text(currentPost.category);
          $('#suggested-grid').html(suggested.map(function (p) {
            var cover = p.coverImage
              ? '<div class="event-media blog-cover-media mb-3"><img src="' + AnstelBlog.escapeHtml(p.coverImage) + '" alt="' + AnstelBlog.escapeHtml(p.title) + '"></div>'
              : '';
            var dateStr = new Date(p.updatedAt || Date.now()).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            return '<div class="col">' +
              '<a href="/company/knowledge-center/post/?slug=' + encodeURIComponent(p.slug) + '" class="text-decoration-none d-block">' +
              cover +
              '<h3 class="blog-card-title text-dark mb-1 line-clamp-2">' + AnstelBlog.escapeHtml(p.title) + '</h3>' +
              '<p class="blog-card-date mb-0">' + dateStr + '</p>' +
              '</a></div>';
          }).join(''));
          $('#suggested-section').show();
        }).catch(function () { /* suggested posts are a nice-to-have — fail silently */ });
      }
    })(jQuery);
  </script>
