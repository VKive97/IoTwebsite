  <script>
    (function ($) {
      var publishedPosts = [];
      var activeCategoryId = null;

      function renderGrid() {
        var posts = activeCategoryId
          ? publishedPosts.filter(function (p) { return p.categoryId === activeCategoryId; })
          : publishedPosts;

        $('#blog-empty').toggle(posts.length === 0);
        $('#blog-empty p').text(activeCategoryId
          ? 'No posts in this category yet — check back soon.'
          : 'No posts published yet — check back soon.');

        $('#blog-grid').html(posts.map(function (p) {
          var cover = p.coverImage
            ? '<div class="event-media blog-cover-media mb-3"><img src="' + AnstelBlog.escapeHtml(p.coverImage) + '" alt="' + AnstelBlog.escapeHtml(p.title) + '"></div>'
            : '';
          var dateStr = new Date(p.updatedAt || Date.now()).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          return '<div class="col">' +
            '<a href="/company/knowledge-center/post/?slug=' + encodeURIComponent(p.slug) + '" class="text-decoration-none d-block">' +
            cover +
            '<h3 class="blog-card-title text-dark mb-1 line-clamp-2">' + AnstelBlog.escapeHtml(p.title) + '</h3>' +
            '<p class="blog-card-date mb-0">' + dateStr + '</p>' +
            '</a></div>';
        }).join(''));
      }

      function renderFilterPills(categories) {
        var allPill = '<button type="button" class="category-pill' + (activeCategoryId ? '' : ' active') + '" data-cat="">All Posts</button>';
        var pills = categories.map(function (c) {
          return '<button type="button" class="category-pill' + (activeCategoryId === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' + AnstelBlog.escapeHtml(c.name) + '</button>';
        }).join('');
        $('#category-filter').html(allPill + pills);
      }

      $('#category-filter').on('click', '.category-pill', function () {
        var id = $(this).data('cat');
        activeCategoryId = id ? parseInt(id, 10) : null;
        $('.category-pill').removeClass('active');
        $(this).addClass('active');
        renderGrid();
      });

      Promise.all([AnstelBlog.getPosts(), AnstelBlog.getCategories()]).then(function (results) {
        var all = results[0], categories = results[1];
        publishedPosts = all
          .filter(function (p) { return p.status === 'published'; })
          .sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); });

        var usedCategoryIds = {};
        publishedPosts.forEach(function (p) { if (p.categoryId) usedCategoryIds[p.categoryId] = true; });
        var categoriesInUse = categories.filter(function (c) { return usedCategoryIds[c.id]; });

        if (categoriesInUse.length) renderFilterPills(categoriesInUse);
        renderGrid();
      }).catch(function () {
        $('#blog-empty').show().find('p').text('Could not load posts right now — please check back soon.');
      });
    })(jQuery);
  </script>
